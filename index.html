<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THEFAXMINATOR'S REPORTING TOOLS</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <style>
    :root {
      --bg-page:      #05050f;
      --slate-400:    #94a3b8;
      --slate-300:    #cbd5e1;
      --cyan-300:     #67e8f9;
      --cyan-400:     #22d3ee;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #05050f;
      display: flex;
      flex-direction: column;
    }

    .title-font { font-family: 'Cinzel Decorative', cursive; font-weight: 700; }

    /* ---- Entrance layout ---- */
    main.entrance {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      /* Extra right-side weight so the globe clears the Viking figure on the left */
      padding: 3rem 8vw 3rem 42vw;
      text-align: center;
    }
    @media (max-width: 700px) {
      /* On narrow screens the figure isn't in the way — recentre */
      main.entrance { padding: 3rem 1.5rem; }
    }

    /* ---- Circular globe button ---- */
    .globe-btn {
      position: relative;
      width: clamp(220px, 42vw, 340px);
      height: clamp(220px, 42vw, 340px);
      border-radius: 50%;
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.3s ease;
    }
    .globe-btn:hover { transform: scale(1.04); }

    .globe-btn .globe-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 45px -5px #00f7ff, 0 0 18px -2px #00f7ff, inset 0 0 40px rgba(0,247,255,0.25);
      transition: box-shadow 0.3s ease;
    }
    .globe-btn:hover .globe-svg {
      box-shadow: 0 0 70px 0 #00f7ff, 0 0 30px 0 #00f7ff, inset 0 0 55px rgba(0,247,255,0.35);
    }

    /* Rotating meridians group */
    .globe-lines { animation: spin 26s linear infinite; transform-origin: 100px 100px; }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .globe-btn .globe-label {
      position: relative;
      z-index: 2;
      font-family: 'Cinzel Decorative', cursive;
      font-weight: 700;
      color: #fff;
      font-size: clamp(0.95rem, 2.1vw, 1.35rem);
      line-height: 1.35;
      letter-spacing: 1px;
      text-shadow: 0 0 12px #00f7ff, 0 0 24px #00f7ff, 0 2px 6px rgba(0,0,0,0.9);
      padding: 0 1.5rem;
      pointer-events: none;
    }

    .enter-hint {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      color: var(--cyan-400);
      opacity: 0.8;
      animation: pulse 2.4s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 0.8; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>

  <!-- BACKGROUND IMAGE — same fixed layer as the rest of the site -->
  <div style="position:fixed; inset:0; z-index:-1; overflow:hidden;">
    <img src="assets/backgroundimage.webp" alt="" style="width:100%; height:100%; object-fit:cover; object-position:center; display:block;">
  </div>

  <!-- HEADER -->
  <header style="background:transparent; padding:2rem 2.5rem 0;">
    <h1 class="title-font" style="font-size:clamp(2rem,6vw,3.25rem); letter-spacing:4px; text-shadow:0 0 30px #00f7ff, 0 0 60px #00f7ff; color:#00f7ff; margin:0; text-align:center;">
      THEFAXMINATOR
    </h1>
  </header>

  <!-- ENTRANCE -->
  <main class="entrance">

    <a class="globe-btn" href="hub.html" aria-label="Enter the World of the Vikings">
      <!-- Inline SVG globe (no new image asset — drawn with the site palette) -->
      <svg class="globe-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="globeFill" cx="38%" cy="32%" r="75%">
            <stop offset="0%"  stop-color="#0b3a52"/>
            <stop offset="55%" stop-color="#0a2036"/>
            <stop offset="100%" stop-color="#05050f"/>
          </radialGradient>
        </defs>

        <!-- Ocean sphere -->
        <circle cx="100" cy="100" r="96" fill="url(#globeFill)" stroke="#22d3ee" stroke-width="2"/>

        <!-- Rotating lat/long grid -->
        <g class="globe-lines" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.55">
          <!-- Meridians (vertical ellipses) -->
          <ellipse cx="100" cy="100" rx="96" ry="96"/>
          <ellipse cx="100" cy="100" rx="72" ry="96"/>
          <ellipse cx="100" cy="100" rx="42" ry="96"/>
          <ellipse cx="100" cy="100" rx="12" ry="96"/>
          <!-- Parallels (horizontal lines) -->
          <line x1="4"  y1="100" x2="196" y2="100"/>
          <line x1="18" y1="62"  x2="182" y2="62"/>
          <line x1="18" y1="138" x2="182" y2="138"/>
          <line x1="42" y1="30"  x2="158" y2="30"/>
          <line x1="42" y1="170" x2="158" y2="170"/>
        </g>

        <!-- Outer glow ring -->
        <circle cx="100" cy="100" r="96" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.7"/>
      </svg>

      <span class="globe-label">Enter the World<br>of the Vikings</span>
    </a>

    <span class="enter-hint">Click the globe to enter</span>

  </main>

</body>
</html>
